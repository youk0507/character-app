<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゆっくり木本</title>

    <style>
        body {
            margin: 0;
            background: white;
            font-family: sans-serif;
            text-align: center;
        }

        /* パスワード画面 */
        #passwordScreen {
            margin-top: 100px;
        }

        #passwordScreen input {
            padding: 12px;
            font-size: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            width: 250px;
        }

        #passwordScreen button {
            margin-top: 20px;
        }

        #error {
            color: red;
            font-size: 18px;
        }

        /* サイト本体 */
        #site {
            display: none;
        }

        h1 {
            margin-top: 30px;
        }

        .character {
            width: 450px;
            margin-top: 30px;
        }

        .message {
            width: 70%;
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            border: 2px solid #ddd;
            border-radius: 20px;
            font-size: 24px;
            background: white;
        }

        button {
            padding: 15px 50px;
            font-size: 24px;
            border: none;
            border-radius: 30px;
            background: #dce6f7;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <!-- パスワード画面 -->
    <div id="passwordScreen">

        <h2>パスワードを入力してください</h2>

        <input
            type="password"
            id="passwordInput"
            placeholder="パスワード"
        >

        <br>

        <button onclick="checkPassword()">入る</button>

        <p id="error"></p>

    </div>


    <!-- サイト本体 -->
    <div id="site">

        <h1>ゆっくり木本</h1>

        <img src="character.png" id="character" class="character">

        <div class="message" id="message">
            ボタンを押してね！
        </div>

        <button onclick="speak()">話す！</button>

    </div>


    <script>

        // パスワード
        const PASSWORD = "kimoto123";


        // パスワード確認
        function checkPassword() {

            const input =
                document.getElementById("passwordInput").value;

            if (input === PASSWORD) {

                document.getElementById("passwordScreen").style.display = "none";

                document.getElementById("site").style.display = "block";

            } else {

                document.getElementById("error").textContent =
                    "パスワードが違います";

            }
        }


        // セリフ
        const messages = [
            {
                text: "結局生茶が一番おいしいんだよね",
                image: "character.png"
            },
            {
                text: "呉中なんでしゃーない",
                image: "character3.png"
            },
            {
                text: "課題？終わってないけど",
                image: "character3.png"
            },
            {
                text: "そうすか",
                image: "character3.png"
            },
            {
                text: "今起きました",
                image: "character3.png"
            },
            {
                text: "良い…！",
                image: "character2.png"
            },
            {
                text: "綾鷹薄いんだよね",
                image: "character3.png"
            }
        ];


        // セリフをランダム表示
        function speak() {

            const random =
                Math.floor(Math.random() * messages.length);

            const selected = messages[random];

            document.getElementById("message").textContent =
                selected.text;

            document.getElementById("character").src =
                selected.image;
        }

    </script>

</body>
</html>
